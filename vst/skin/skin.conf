# Skin build options (name=value); build_skin.sh's extra arguments override these.
#   skin=mnm | default | inverted | lowcontrast   mnm: the real Monomachine LCD (soft cool grey, near-black pixels); the rest are
#                                            upstream's colour presets (Skin.h): black on white, white on black, grey on light grey
#   ink=RRGGBB paper=RRGGBB                  a custom pair (overrides the preset)
#   scale=4                                  screen px per LCD px: 4 = two pages per tab; upstream draws at 3
#   chassis=1 | 0                            the hardware-style faceplate + bezel around one LCD (default on for layout=2x2)
skin=mnm

layout=2x2
